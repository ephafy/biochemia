<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 306" role="img" aria-labelledby="t-kinetika">
<title id="t-kinetika">Rýchlosť enzýmovej reakcie v závislosti od koncentrácie substrátu (schematicky) na dvoch enzýmoch, ktoré fosforylujú glukózu. Hexokináza má nízke Km: nasýti sa už pri nepatrnej koncentrácii glukózy a jej rýchlosť sa s glykémiou nemení. Glukokináza má Km okolo 10 mmol/l a veľkú maximálnu rýchlosť: v rozsahu glykémie od stavu nalačno po stav po jedle jej rýchlosť rastie spolu s koncentráciou glukózy.</title>
