<text class="lblb" x="26" y="130" text-anchor="middle" transform="rotate(-90 26 130)">aktivita enzýmu</text>
<path class="stk-n" d="M112,232v5M164,232v5M216,232v5M268,232v5M320,232v5"/>
<text class="sub" x="112" y="250" text-anchor="middle">2</text>
<text class="sub" x="164" y="250" text-anchor="middle">4</text>
<text class="sub" x="216" y="250" text-anchor="middle">6</text>
<text class="sub" x="268" y="250" text-anchor="middle">8</text>
<text class="sub" x="320" y="250" text-anchor="middle">10</text>
<rect class="zone-r" x="112" y="40" width="26" height="192"/>
<path class="stk-acc2" d="M64,230C104,226 106,62 125,62C144,62 152,226 206,230"/>
<path class="stk-acc" d="M178,230C222,226 228,62 247,62C266,62 274,226 318,230"/>
<text class="sub" x="125" y="54" text-anchor="middle">pepsín</text>
<text class="sub" x="247" y="54" text-anchor="middle">enzým cytosolu</text>
<text class="sub" x="125" y="264" text-anchor="middle">žalúdok: pH 2–3</text>

