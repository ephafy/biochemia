<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" role="img" aria-labelledby="t-ph-teplota">
<title id="t-ph-teplota">Vplyv prostredia na aktivitu enzýmu (schematicky). Vľavo: aktivita v závislosti od pH má tvar zvona; pepsín má vrchol v kyslej oblasti, ktorá zodpovedá žalúdočnej šťave s pH 2 až 3, enzým cytosolu okolo pH 7. Vpravo: s teplotou aktivita najprv stúpa, vrchol má väčšina ľudských enzýmov medzi 35 a 40 °C, potom prudko klesá, lebo enzým denaturuje.</title>
