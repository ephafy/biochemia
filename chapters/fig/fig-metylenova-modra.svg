<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 232" role="img" aria-labelledby="t-metylenova-modra">
<title id="t-metylenova-modra">Metylénová modrá ako umelý akceptor vodíka. Oxidovaná forma je modrá. Keď v skúmavke beží dehydrogenácia, farbivo prijme vodíky zo substrátu a zmení sa na bezfarebnú leukoformu. Kyslík zo vzduchu ju bez enzýmu oxiduje späť a roztok znova zmodrie. Výrez: v erytrocyte sa metylénová modrá redukuje pomocou NADPH z pentózofosfátovej dráhy a jej leukoforma vracia železo methemoglobínu do dvojmocného stavu.</title>
<mol v="metylenova-modra" id="mb" x="150" y="84" zv="N10,N10-b4" nazov="metylénová modrá – modrá"/>
<mol v="leukometylenova-modra" id="lm" x="552" y="84" zv="N10" nazov="leukoforma – bezfarebná"/>
<rx od="{mb.r+10,-18}" do="{lm.l-10,-18}" enzym="dehydrogenáza: substrát odovzdá 2 H" e="hore"/>
<rx od="{lm.l-10,18}" do="{mb.r+10,18}" enzym="kyslík zo vzduchu (bez enzýmu)" e="dole"/>
<text class="lblb" x="351" y="88" text-anchor="middle">⟳</text>
<text class="sub" x="350" y="190" text-anchor="middle">odfarbenie = v skúmavke beží dehydrogenácia · zmodranie = pribudol kyslík</text>
<plus rk="methb" x="618" y="186" tip="farbivo ako liek pri methemoglobinémii"/>
<legenda x="14" y="218" polozky="rx,enz,zv,rk" w="672"/>

<vyrez id="methb" h="232" nadpis="Farbivo ako liek: tri spriahnuté kolesá v erytrocyte">
<uzol id="m-a1" x="96" y="58" text="glukóza-6-fosfát" trieda="bx-c"/>
<uzol id="m-a2" x="582" y="58" text="6-fosfoglukonolaktón" href="05_pentozy_fruktoza_galaktoza#fig-nadph-glutation" tip="Kapitola 5: NADPH v erytrocyte"/>
<rx od="{m-a1.r}" do="{m-a2.l}" typ="nevratna" enzym="glukóza-6-fosfátdehydrogenáza" ko="NADP⁺>NADPH" e="hore"/>
<uzol id="m-b1" x="96" y="128" text="metylénová modrá"/>
<uzol id="m-b2" x="582" y="128" text="leukoforma" trieda="bx-c"/>
<rx od="{m-b1.r}" do="{m-b2.l}" ko="NADPH>NADP⁺" e="hore"/>
<uzol id="m-c1" x="582" y="198" text="methemoglobín (Fe³⁺)|kyslík neviaže" trieda="bx-m"/>
<uzol id="m-c2" x="96" y="198" text="hemoglobín (Fe²⁺)" trieda="bx-c"/>
<rx od="{m-c1.l}" do="{m-c2.r}" ko="leukoforma>metylénová modrá" e="hore"/>
<text class="t-inh" x="340" y="166" text-anchor="middle">deficit dehydrogenázy: NADPH chýba → farbivo ostane oxidované a samo zaťaží krvinku</text>
</vyrez>
</svg>
