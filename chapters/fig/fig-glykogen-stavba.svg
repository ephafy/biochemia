er-end="url(#sip)"/><text class="sub" x="190" y="46">+ Pᵢ →</text><text class="sub" x="190" y="58">Glc-1-P</text><text class="sub" x="14" y="214">odštepuje od neredukujúcich koncov,</text><text class="sub" x="14" y="226">zastane 4 zvyšky pred vetvením</text><path class="stk-n s-d" d="M238,8L238,236"/><text class="lblb" x="250" y="16">2 · odvetvujúci enzým: transferáza</text><text class="sub" x="248" y="153.5">…</text><path class="bd" d="M258.0,150.0L268.0,150.0"/><path class="bd" d="M268.0,150.0L285.0,150.0"/><path class="bd" d="M285.0,150.0L302.0,150.0"/><path class="bd" d="M302.0,150.0L319.0,150.0"/><path class="bd" d="M319.0,150.0L336.0,150.0"/><path class="bd" d="M336.0,150.0L353.0,150.0"/><path class="bd" d="M353.0,150.0L370.0,150.0"/><path class="bd" d="M370.0,150.0L387.0,150.0"/><path class="bd" d="M387.0,150.0L404.0,150.0"/><path class="bd" d="M404.0,150.0L421.0,150.0"/><path class="bd" d="M421.0,150.0L438.0,150.0"/><path class="bd hl" d="M319.0,150.0L328.5,135.5"/><path class="vz" d="M328.5,135.5L338.0,121.0"/><path class="vz" d="M338.0,121.0L347.5,106.5"/><path class="vz" d="M347.5,106.5L357.0,92.0"/><circle class="pc" cx="268.0" cy="150.0" r="6.2"/><circle class="pc" cx="285.0" cy="150.0" r="6.2"/><circle class="pc" cx="302.0" cy="150.0" r="6.2"/><circle class="pc" cx="319.0" cy="150.0" r="6.2"/><circle class="pc" cx="336.0" cy="150.0" r="6.2"/><circle class="pc" cx="353.0" cy="150.0" r="6.2"/><circle class="pc" cx="370.0" cy="150.0" r="6.2"/><circle class="pc" cx="387.0" cy="150.0" r="6.2"/><circle class="pc hl" cx="404.0" cy="150.0" r="6.2"/><circle class="pc hl" cx="421.0" cy="150.0" r="6.2"/><circle class="pc hl" cx="438.0" cy="150.0" r="6.2"/><circle class="pc" cx="328.5" cy="135.5" r="6.2"/><circle class="komp" cx="338.0" cy="121.0" r="6.2"/><circle class="komp" cx="347.5" cy="106.5" r="6.2"/><circle class="komp" cx="357.0" cy="92.0" r="6.2"/><path class="arw" d="M366,92Q421,92 421,138" marker-end="url(#sip)"/><text class="sub" x="250" y="214">prenesie 3 zvyšky vetvy na koniec</text><text class="sub" x="250" y="226">iného reťazca (α1→4 za α1→4)</text><path class="stk-n s-d" d="M474,8L474,236"/><text class="lblb" x="486" y="16">3 · … a α(1→6)-glukozidáza</text><text class="sub" x="484" y="153.5">…</text><path class="bd" d="M494.0,150.0L504.0,150.0"/><path class="bd" d="M504.0,150.0L521.0,150.0"/><path class="bd" d="M521.0,150.0L538.0,150.0"/><path class="bd" d="M538.0,150.0L555.0,150.0"/><path class="bd" d="M555.0,150.0L572.0,150.0"/><path class="bd" d="M572.0,150.0L589.0,150.0"/><path class="bd" d="M589.0,150.0L606.0,150.0"/><path class="bd" d="M606.0,150.0L623.0,150.0"/><path class="bd" d="M623.0,150.0L640.0,150.0"/><path class="bd" d="M640.0,150.0L657.0,150.0"/><path class="bd" d="M657.0,150.0L674.0,150.0"/><path class="bd hl" d="M555.0,150.0L564.5,135.5"/><circle class="pc" cx="504.0" cy="150.0" r="6.2"/><circle class="pc" cx="521.0" cy="150.0" r="6.2"/><circle class="pc" cx="538.0" cy="150.0" r="6.2"/><circle class="pc" cx="555.0" cy="150.0" r="6.2"/><circle class="pc" cx="572.0" cy="150.0" r="6.2"/><circle class="pc" cx="589.0" cy="150.0" r="6.2"/><circle class="pc" cx="606.0" cy="150.0" r="6.2"/><circle class="pc" cx="623.0" cy="150.0" r="6.2"/><circle class="pc" cx="640.0" cy="150.0" r="6.2"/><circle class="pc" cx="657.0" cy="150.0" r="6.2"/><circle class="pc" cx="674.0" cy="150.0" r="6.2"/><circle class="pc hl" cx="564.5" cy="135.5" r="6.2"/><path class="arw" d="M568,126L586,92" marker-end="url(#sip)"/><text class="lblb" x="592" y="88">voľná glukóza</text><text class="sub" x="588" y="116">+ H₂O</text><text class="sub" x="486" y="214">hydrolyzuje posledný zvyšok;</text><text class="sub" x="486" y="226">reťazec je rovný – pokračuje fosforyláza</text><circle class="pc" cx="26" cy="252" r="5"/><text class="sub" x="36" y="255.5">zvyšok glukózy</text>
