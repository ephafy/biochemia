<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 268" role="img" aria-labelledby="t-glykogen-stavba">
<title id="t-glykogen-stavba">Stavba glykogénu a jeho rozklad pri mieste vetvenia v troch krokoch. Krúžok je jeden zvyšok glukózy; zvyšky v reťazci spája väzba α(1→4), vetva nasadá väzbou α(1→6). Krok 1: glykogénfosforyláza odštepuje zvyšky z neredukujúcich koncov ako glukóza-1-fosfát a zastaví sa štyri zvyšky pred vetvením. Krok 2: odvetvujúci enzým prenesie tri zo štyroch zvyškov vetvy na koniec susedného reťazca. Krok 3: ten istý enzým hydrolyzuje väzbu α(1→6) posledného zvyšku a uvoľní voľnú glukózu; reťazec je opäť rovný a fosforyláza pokračuje.</title>
