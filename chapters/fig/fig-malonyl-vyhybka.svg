<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="t-malonyl-vyhybka">
<title id="t-malonyl-vyhybka">Prepnutie pečeňovej bunky medzi stavbou a rozoberaním mastných kyselín. Vľavo po jedle: inzulín drží acetyl-CoA-karboxylázu aktívnu, z glukózy vzniká cez citrát acetyl-CoA a malonyl-CoA a z neho palmitát, ktorý odchádza ako triacylglycerol vo VLDL; malonyl-CoA zatvára vstup mastných kyselín do mitochondrie. Vpravo nalačno: glukagón a kináza AMPK karboxylázu vypnú, malonyl-CoA klesne a mastné kyseliny z tukového tkaniva vstupujú cez karnitín do mitochondrie; β-oxidácia dáva acetyl-CoA pre ketolátky a energiu pre glukoneogenézu. Acyl-CoA navyše brzdí karboxylázu.</title>
<rect class="komp" x="10" y="26" width="334" height="364" rx="3"/>
<rect class="komp" x="356" y="26" width="334" height="364" rx="3"/>
<text class="cap" x="20" y="44">po jedle · inzulín</text>
<text class="cap" x="366" y="44">nalačno · glukagón, adrenalín, AMPK</text>

<uzol id="g1" x="80" y="78" text="glukóza" w="80"/>
<uzol id="c1" x="230" y="78" text="citrát (z mitochondrie)" w="170"/>
<rx od="{g1.r}" do="{c1.l}"/>
<uzol id="a1" x="230" y="140" text="acetyl-CoA" trieda="bx-c" w="100"/>
<rx od="{c1.b}" do="{a1.t}"/>
<uzol id="m1" x="230" y="216" text="malonyl-CoA ↑" trieda="bx-m" w="116"/>
<rx od="{a1.b}" do="{m1.t}" typ="nevratna" enzym="karboxyláza|zapnutá" akt="inzulín · citrát" e="vlavo"/>
<uzol id="p1" x="230" y="290" text="palmitát" w="90"/>
<rx od="{m1.b}" do="{p1.t}"/>
<uzol id="v1" x="230" y="352" text="TAG → VLDL → krv" w="150"/>
<rx od="{p1.b}" do="{v1.t}"/>
<uzol id="x1" x="76" y="290" text="vstup MK|do mitochondrie" w="116"/>
<vplyv typ="inh" od="{m1.l}" do="{x1.t+10,0}" cez="96,216"/>
<text class="sub" x="76" y="326" text-anchor="middle">zatvorený</text>

<uzol id="t2" x="436" y="78" text="tukové tkanivo" trieda="bx-m" w="120"/>
<uzol id="f2" x="610" y="78" text="MK na albumíne" w="124"/>
<rx od="{t2.r}" do="{f2.l}" enzym="lipolýza" e="hore"/>
<uzol id="y2" x="610" y="140" text="acyl-CoA" trieda="bx-c" w="90"/>
<rx od="{f2.b}" do="{y2.t}"/>
<uzol id="b2" x="610" y="216" text="β-oxidácia" trieda="bx-c" w="100"/>
<rx od="{y2.b}" do="{b2.t}" enzym="karnitín|vstup otvorený" e="vpravo"/>
<uzol id="k2" x="610" y="290" text="acetyl-CoA" w="100"/>
<rx od="{b2.b}" do="{k2.t}"/>
<uzol id="e2" x="610" y="352" text="ketolátky → krv" w="130"/>
<rx od="{k2.b}" do="{e2.t}"/>
<uzol id="m2" x="436" y="216" text="malonyl-CoA ↓" w="116"/>
<uzol id="acc2" x="436" y="140" text="karboxyláza|vypnutá" w="110"/>
<vplyv od="{acc2.b}" do="{m2.t}"/>
<vplyv typ="inh" od="{y2.l}" do="{acc2.r}"/>
<text class="sub" x="436" y="250" text-anchor="middle">nič nebrzdí vstup</text>
<uzol id="gn" x="436" y="320" text="ATP · NADH|→ glukoneogenéza" w="140"/>
<rx od="{b2.bl+6,0}" do="{gn.tr-10,0}"/>
</svg>
