<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 356" role="img" aria-labelledby="t-travenie-tag">
<title id="t-travenie-tag">Štiepenie tukov z potravy v lúmene tenkého čreva. Pankreatická lipáza s kolipázou hydrolyzuje v triacylglycerole esterové väzby v krajných polohách 1 a 3; vznikne 2-monoacylglycerol a dve mastné kyseliny. Cholesterolesteráza štiepi estery cholesterolu na cholesterol a mastnú kyselinu, fosfolipáza A2 odštiepi z fosfolipidu mastnú kyselinu z polohy 2 a ostane lyzofosfolipid. Všetky produkty sa so soľami žlčových kyselín spoja do zmiešaných miciel.</title>
<text class="cap" x="12" y="14">lúmen tenkého čreva · povrch tukovej kvapky</text>
<mol v="triacylglycerol" id="tag" x="126" y="96" zv="O1,O3,A1-O1,A3-O3"/>
<mol v="2-monoacylglycerol" id="mag" x="470" y="86"/>
<mol v="mastna-kyselina" id="fa" x="630" y="96" nazov="2 mastné kyseliny" skratka="nie"/>
<rx od="{tag.r+8,-6}" do="{mag.l-8,4}" enzym="pankreatická lipáza|+ kolipáza" ko="2 H₂O>" e="hore"/>
<text class="lblb" x="566" y="100" text-anchor="middle">+</text>
<text class="sub" x="126" y="186" text-anchor="middle">modro: väzby, ktoré lipáza štiepi</text>
<legenda x="20" y="340" polozky="rx,enz,ko,zv"/>

<uzol id="ce" x="126" y="232" text="ester cholesterolu" w="150"/>
<uzol id="ch" x="410" y="232" text="cholesterol + MK" w="150"/>
<rx od="{ce.r}" do="{ch.l}" enzym="cholesterolesteráza" e="hore"/>
<uzol id="pl" x="126" y="290" text="fosfolipid" w="150"/>
<uzol id="lpl" x="410" y="290" text="lyzofosfolipid + MK" w="150"/>
<rx od="{pl.r}" do="{lpl.l}" enzym="fosfolipáza A₂ (poloha 2)" e="hore"/>
<uzol id="mic" x="590" y="258" text="zmiešaná micela|+ soli žlčových|kyselín" trieda="bx-c" w="130" h="64"/>
<rx od="{mag.b+30,2}" do="{mic.t-30,0}"/>
<rx od="{fa.b+0,2}" do="{mic.t+34,0}"/>
<rx od="{ch.r}" do="{mic.l+0,-14}"/>
<rx od="{lpl.r}" do="{mic.l+0,16}"/>
</svg>
