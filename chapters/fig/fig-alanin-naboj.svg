<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 168" role="img" aria-labelledby="t-alanin-naboj">
<title id="t-alanin-naboj">Náboj aminokyseliny závisí od pH. V kyslom roztoku je alanín katión s nábojom +1. Okolo pH 2 odovzdá protón karboxyl a vznikne obojaký ión s nulovým súčtom nábojov, ktorý prevažuje pri pH 7. Okolo pH 9 až 10 odovzdá protón aj aminoskupina a vznikne anión s nábojom −1.</title>
<mol v="alanin-kation" id="k" x="105" y="62" nazov="katión" skratka="náboj +1" zv="O1b"/>
<mol v="alanin" id="z" x="350" y="62" nazov="obojaký ión" skratka="náboj 0" zv="O1b,N"/>
<mol v="alanin-anion" id="n" x="595" y="62" nazov="anión" skratka="náboj −1" zv="N"/>
<rx od="{k.r+16,0}" do="{z.l-16,0}" typ="vratna"/>
<rx od="{z.r+16,0}" do="{n.l-16,0}" typ="vratna"/>
<text class="sub" x="228" y="50" text-anchor="middle">− H⁺ z karboxylu</text>
<text class="lblb" x="228" y="80" text-anchor="middle">pK₁ ≈ 2</text>
<text class="sub" x="472" y="50" text-anchor="middle">− H⁺ z aminoskupiny</text>
<text class="lblb" x="472" y="80" text-anchor="middle">pK₂ ≈ 9–10</text>
<text class="sub" x="105" y="138" text-anchor="middle">silno kyslý roztok</text>
<text class="sub" x="350" y="138" text-anchor="middle">pH 7 (krv, cytosol)</text>
<text class="sub" x="595" y="138" text-anchor="middle">silno zásaditý roztok</text>
<legenda x="20" y="160" polozky="vr,zv"/>
</svg>
