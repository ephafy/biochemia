<circle class="dot" cx="234" cy="178" r="3.4"/>
<circle class="dot" cx="306" cy="142" r="3.4"/>
<circle class="dot" cx="378" cy="106" r="3.4"/>
<circle class="dot" cx="450" cy="70" r="3.4"/>
<path class="stk-n" d="M162,250v5M234,250v5M306,250v5M378,250v5M450,250v5"/>
<text class="sub" x="90" y="266" text-anchor="middle">0</text>
<text class="sub" x="162" y="266" text-anchor="middle">1,2</text>
<text class="sub" x="234" y="266" text-anchor="middle">2,4</text>
<text class="sub" x="306" y="266" text-anchor="middle">3,6</text>
<text class="sub" x="378" y="266" text-anchor="middle">4,8</text>
<text class="sub" x="450" y="266" text-anchor="middle">6,0</text>
<text class="sub" x="82" y="254" text-anchor="end">0</text>
<path class="stk-acc2 s-d" d="M90,160L270,160L270,246" marker-end="url(#sip)"/>
<circle class="dotm" cx="270" cy="160" r="3.6"/>
<text class="sub" x="96" y="153">A vzorky</text>
<text class="sub" x="276" y="236">c vzorky</text>
<text class="sub" x="300" y="100" text-anchor="end">štandardy</text>
<text class="sub" x="470" y="100">lineárny rozsah: A = ε · c · l</text>
<text class="sub" x="530" y="60">mimo rozsahu –</text>
<text class="sub" x="530" y="72">vzorku zriediť</text>
<text class="sub" x="470" y="238">slepá vzorka nastaví nulu prístroja</text>
