<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-labelledby="t-kalibracna-krivka">
<title id="t-kalibracna-krivka">Kalibračná krivka (schematicky). Na vodorovnej osi je koncentrácia p-nitrofenolu v piatich štandardoch od 1,2 do 6,0 µmol/l, na zvislej absorbancia pri 405 nm. Body ležia na priamke prechádzajúcej nulou. Absorbancia neznámej vzorky sa prenesie na priamku a na vodorovnej osi sa odčíta jej koncentrácia. Pri vyšších koncentráciách sa krivka ohýba – tam odčítanie neplatí a vzorku treba zriediť.</title>
<path class="arw" d="M90,250L640,250" marker-end="url(#sip)"/>
<path class="arw" d="M90,250L90,28" marker-end="url(#sip)"/>
<text class="lblb" x="365" y="290" text-anchor="middle">koncentrácia p-nitrofenolu v skúmavke (µmol/l)</text>
<text class="lblb" x="30" y="140" text-anchor="middle" transform="rotate(-90 30 140)">absorbancia pri 405 nm</text>
<path class="stk-acc" d="M90,250L450,70"/>
<path class="stk-n s-d" d="M450,70C500,45 550,36 610,32"/>
